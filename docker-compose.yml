version: "3.8"

services:

  postgres:
    image: postgres:17
    container_name: gym-postgres

    environment:
      POSTGRES_USER: gymadmin
      POSTGRES_PASSWORD: gympassword
      POSTGRES_DB: gymdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./gym-backend

    container_name: gym-backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    env_file:
      - ./gym-backend/.env

  frontend:
    build:
      context: ./frontend

    container_name: gym-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: